[package]
name = "media_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "rustls"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
