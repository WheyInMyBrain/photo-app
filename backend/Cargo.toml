[package]
name = "backend"
version = "0.1.0"
edition = "2021"
default-run = "backend"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bytemuck = "1.25.2"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", features = ["jpeg", "png", "webp"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version= "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "fast-rng"] }

media_downloader = { path = "../crates/media_downloader" }
media_processing = { path = "../crates/media_processing" }