services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3001:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./storage:/data/storage:ro
      - ~/ssl:/etc/ssl:ro    
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # Allocate shared memory so HNSW index builds and parallel scans don't OOM
    shm_size: '1gb'
    environment:
      POSTGRES_DB: photo_app
      POSTGRES_USER: photo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-7777}
    volumes:
      # Isolate Postgres data directory from application file storage
      - ./storage/postgres:/var/lib/postgresql
    expose:
      - "5432"
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=64MB
        -c maintenance_work_mem=512MB
        -c hnsw.ef_search=60
        -c checkpoint_completion_target=0.9
        -c max_wal_size=8GB
        -c min_wal_size=1GB
        -c random_page_cost=3.0
        -c effective_io_concurrency=2
        -c max_connections=50
        -c max_parallel_workers_per_gather=4
        -c max_parallel_maintenance_workers=2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_user -d photo_app"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./storage:/data
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      chrome:
        condition: service_started

  chrome:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    shm_size: '2gb'
    environment:
      - MAX_CONCURRENT_SESSIONS=2
      - PREBOOT_CHROME=true
    expose:
      - "3000"